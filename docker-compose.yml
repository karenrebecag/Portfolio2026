services:
  postgres:
    image: postgres:16-alpine
    container_name: karen-portfolio-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: karen_portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d karen_portfolio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
